name: Build OpenWrt Snapshot APK

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build (empty = all packages)"
        required: false
        type: string
        default: ""

      release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-openwrt-snapshot-apk
  cancel-in-progress: false

env:
  ARCH: x86_64
  FEEDNAME: custom_packages

jobs:
  build:
    name: Build x86_64 Snapshot APK
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show repository status
        run: |
          echo "===== Git ====="
          git --version
          git status --short

          echo
          echo "===== Submodules ====="
          git submodule status --recursive

      - name: Build OpenWrt Snapshot packages
        uses: openwrt/gh-action-sdk@main
        env:
          # OpenWrt Snapshot SDK
          ARCH: x86_64-SNAPSHOT

          # Custom feed name
          FEEDNAME: custom_packages

          # Empty = build all packages
          PACKAGES: ${{ inputs.packages }}

          # Generate packages.adb
          INDEX: 1

          # Skip package refresh checks
          NO_REFRESH_CHECK: 1

          # APK repository signing key
          PRIVATE_KEY: ${{ secrets.COOLKIDWRT_PRIVATE }}

      - name: Show build output
        shell: bash
        run: |
          echo "===== Package output ====="

          if [[ ! -d "bin/packages/${ARCH}" ]]; then
            echo "::error::OpenWrt package directory was not generated."
            exit 1
          fi

          find "bin/packages/${ARCH}" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "packages.adb" \
              -o -name "index.json" \
            \) \
            -print | sort

      - name: Verify APK feed
        shell: bash
        run: |
          PACKAGE_DIR="bin/packages/${ARCH}/${FEEDNAME}"

          echo "Package directory:"
          echo "$PACKAGE_DIR"

          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "::error::Package feed directory does not exist:"
            echo "$PACKAGE_DIR"

            echo
            echo "Available directories:"
            find "bin/packages/${ARCH}" \
              -maxdepth 2 \
              -type d \
              -print | sort

            exit 1
          fi

          echo
          echo "===== APK packages ====="

          find "$PACKAGE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print | sort

          APK_COUNT="$(find "$PACKAGE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)"

          echo
          echo "APK count: $APK_COUNT"

          if [[ "$APK_COUNT" -eq 0 ]]; then
            echo "::error::No APK packages were generated."
            exit 1
          fi

          if [[ ! -f "$PACKAGE_DIR/packages.adb" ]]; then
            echo "::error::packages.adb was not generated."
            exit 1
          fi

          echo
          echo "packages.adb:"
          ls -lh "$PACKAGE_DIR/packages.adb"

          if [[ -f "$PACKAGE_DIR/index.json" ]]; then
            echo
            echo "index.json:"
            ls -lh "$PACKAGE_DIR/index.json"
          fi

      # ==========================================================
      # GitHub Pages
      # ==========================================================

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          PACKAGE_DIR="bin/packages/${ARCH}/${FEEDNAME}"

          rm -rf _site

          mkdir -p \
            "_site/packages/${ARCH}" \
            "_site/keys"

          echo "===== Copy APK packages ====="

          cp "$PACKAGE_DIR"/*.apk \
            "_site/packages/${ARCH}/"

          cp "$PACKAGE_DIR/packages.adb" \
            "_site/packages/${ARCH}/"

          if [[ -f "$PACKAGE_DIR/index.json" ]]; then
            cp "$PACKAGE_DIR/index.json" \
              "_site/packages/${ARCH}/"
          fi

          # ------------------------------------------------------
          # Public signing key
          #
          # IMPORTANT:
          # COOLKIDWRT_PRIVATE is the private key.
          # The public key must be committed to:
          #
          # keys/coolkidwrt-snapshots.pem
          # ------------------------------------------------------

          if [[ ! -f "keys/coolkidwrt-snapshots.pem" ]]; then
            echo "::error::Public signing key not found:"
            echo "keys/coolkidwrt-snapshots.pem"
            exit 1
          fi

          cp keys/coolkidwrt-snapshots.pem \
            "_site/keys/coolkidwrt-snapshots.pem"

          # ------------------------------------------------------
          # Repository index page
          # ------------------------------------------------------

          cat > "_site/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Coolkids OpenWrt APK Repository</title>
          </head>
          <body>
            <h1>Coolkids OpenWrt APK Repository</h1>

            <h2>OpenWrt Snapshot</h2>

            <ul>
              <li>
                <a href="packages/${ARCH}/packages.adb">
                  x86_64 APK Repository
                </a>
              </li>
              <li>
                <a href="packages/${ARCH}/">
                  x86_64 Packages
                </a>
              </li>
              <li>
                <a href="keys/coolkidwrt-snapshots.pem">
                  Repository Public Key
                </a>
              </li>
            </ul>

            <hr>

            <p>
              Architecture: ${ARCH}
            </p>

            <p>
              Feed: ${FEEDNAME}
            </p>

            <p>
              Build:
              ${GITHUB_SHA}
            </p>

            <p>
              Build time:
              $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            </p>
          </body>
          </html>
          EOF

          echo
          echo "===== GitHub Pages site ====="

          find _site \
            -maxdepth 4 \
            -type f \
            -print | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================================
      # GitHub Actions Artifact
      # ==========================================================

      - name: Upload APK feed
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-snapshot-x86_64-apk
          path: |
            bin/packages/x86_64/custom_packages/*.apk
            bin/packages/x86_64/custom_packages/packages.adb
            bin/packages/x86_64/custom_packages/index.json
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Prepare release assets
        if: ${{ inputs.release }}
        shell: bash
        run: |
          PACKAGE_DIR="bin/packages/${ARCH}/${FEEDNAME}"

          mkdir -p release

          cp "$PACKAGE_DIR"/*.apk release/
          cp "$PACKAGE_DIR/packages.adb" release/

          if [[ -f "$PACKAGE_DIR/index.json" ]]; then
            cp "$PACKAGE_DIR/index.json" release/
          fi

          echo "===== Release assets ====="
          ls -lh release/

      - name: Generate release information
        if: ${{ inputs.release }}
        id: release_info
        shell: bash
        run: |
          DATE="$(date -u +'%Y%m%d')"
          TAG="snapshot-${DATE}"

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          cat > release/README.txt <<EOF
          OpenWrt Snapshot APK packages

          Architecture: x86_64
          Feed: ${FEEDNAME}
          Build date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')
          Commit: ${GITHUB_SHA}

          This release was built from the OpenWrt Snapshot SDK.

          APK packages:
          - *.apk

          Repository metadata:
          - packages.adb
          - index.json
          EOF

      - name: Create GitHub Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_DATE: ${{ steps.release_info.outputs.date }}
        shell: bash
        run: |
          echo "Creating/updating release:"
          echo "$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists, uploading assets..."

            gh release upload \
              "$RELEASE_TAG" \
              release/* \
              --clobber
          else
            echo "Creating new release..."

            gh release create \
              "$RELEASE_TAG" \
              release/* \
              --title "OpenWrt Snapshot APK - ${RELEASE_DATE}" \
              --notes "OpenWrt Snapshot x86_64 APK packages.

          Build date: ${RELEASE_DATE} UTC
          Architecture: x86_64
          Feed: ${FEEDNAME}

          Built automatically from:
          ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          fi